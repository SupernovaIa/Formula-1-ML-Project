<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InstrumentSerif.woff2" as="font" type="font/woff2" crossorigin />
    <title>Formula 1 ML</title>
    <script>
      // Before first paint: saved theme, so nothing flashes from one to the other.
      (function () {
        try {
          var t = localStorage.getItem("f1-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="a-page">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
